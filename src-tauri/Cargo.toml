[package]
name = "omp-d"
version = "0.1.0"
description = "Desktop GUI for the Oh My Pi coding harness"
authors = ["omp-d contributors"]
edition = "2024"

[lib]
name = "omp_d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
